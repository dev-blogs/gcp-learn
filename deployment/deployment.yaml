apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: storage-test
  name: storage-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-test
  template:
    metadata:
      labels:
        app: storage-test
    spec:
      containers:
        - name: storage-test
          image: devblogs1/storage-test-image:1.0
          volumeMounts:
            - name: google-cloud-key
              mountPath: /var/secrets/google
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
      volumes:
        - name: google-cloud-key
          secret:
            secretName: my-service-account-key